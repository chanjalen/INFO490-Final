# Render deployment configuration
# Docs: https://render.com/docs/render-yaml-reference

services:
  - type: web
    name: soclose
    runtime: python
    buildCommand: "bash build.sh"
    preDeployCommand: "python manage.py refresh_posters"
    startCommand: "gunicorn moviefinder.wsgi:application --log-file -"
    envVars:
      - key: SECRET_KEY
        generateValue: true        # Render generates a secure random value
      - key: DEBUG
        value: false
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: ENABLE_FLAN_T5
        value: false               # disabled on free tier to save RAM
      - key: DATABASE_URL
        fromDatabase:
          name: soclose-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: soclose-db
    databaseName: soclose
    user: soclose
    plan: free
