# Render deployment configuration
# Docs: https://render.com/docs/render-yaml-reference

services:
  - type: web
    name: soclose
    runtime: python
    buildCommand: "bash build.sh"
    startCommand: "bash start.sh"
    envVars:
      - key: SECRET_KEY
        generateValue: true        # Render generates a secure random value
      - key: DEBUG
        value: false
      - key: APP_ENV
        value: production
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: FLAN_T5_ENABLED
        value: false               # disabled on free tier to save RAM
      - key: GEMINI_API_KEY
        sync: false
      - key: USE_GEMINI
        value: true
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: TMDB_API_KEY
        sync: false
      - key: TMDB_IMPORT_ON_PREPARE
        value: true
      - key: TMDB_IMPORT_TARGET
        value: 50000
      - key: TMDB_IMPORT_PAGES
        value: 500
      - key: TMDB_IMPORT_MIN_VOTES
        value: 0
      - key: TMDB_IMPORT_LANGUAGE
        value: all
      - key: LOCAL_DENSE_ENABLED
        value: false
      - key: DATABASE_URL
        fromDatabase:
          name: soclose-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11.0"

databases:
  - name: soclose-db
    databaseName: soclose
    user: soclose
    plan: free
