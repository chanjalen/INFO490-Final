<section class="search-panel" data-search-panel>
    <form method="get" action="{% url 'results' %}" class="search-panel__form" id="sp-form">

        <!-- Search card: zones A + B + C -->
        <div class="sp-zone-wrapper">

            <!-- Zone A: committed pending pills -->
            <div class="sp-pills-zone" id="sp-pills-zone"></div>
            <hr class="sp-zone-divider" id="sp-zone-divider">

            <!-- Zone B: breadcrumb path + input + buttons -->
            <div class="sp-bar">
                <span class="sp-icon" aria-hidden="true">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                    </svg>
                </span>
                <div class="sp-bc-row">
                    <div class="sp-bc-path" id="sp-bc-path"></div>
                    <input
                        class="sp-input"
                        id="sp-input"
                        placeholder="What do you remember?"
                        autocomplete="off"
                    >
                </div>
                <button class="sp-semicolon-btn" id="sp-semicolon-btn" type="button" title="Add another at this level ( ; )">;</button>
                <button class="sp-action-btn sp-action-btn--add" id="sp-action-btn" type="button">
                    <span id="sp-action-label">Add</span>
                </button>
            </div>

            <p class="sp-hint" id="sp-hint">
                Press <strong>;</strong> to add another &nbsp;·&nbsp;
                <strong>Enter</strong> to save &nbsp;·&nbsp;
                <strong>Esc</strong> to go back
            </p>

            <!-- Zone C: navigation chips -->
            <hr class="sp-chips-divider">
            <div class="sp-chips-zone" id="sp-chips-zone"></div>
        </div>

        <!-- Hidden fields submitted to Django -->
        <input type="hidden" name="q" id="sp-q">
        <input type="hidden" name="focus" id="sp-focus">

        <!-- Filter bar -->
        <div class="filter-bar">
            <div class="filter-bar__intro">
                <span class="pill pill--dark">Filters</span>
            </div>
            <div class="filter-grid">
                <label class="filter">
                    <span class="filter__label">Genre</span>
                    <select class="filter__select" name="genre" data-filter-select="genre">
                        <option value="">Any genre</option>
                        {% for genre in filters.genres %}
                            <option value="{{ genre }}" {% if selected_genre == genre %}selected{% endif %}>{{ genre }}</option>
                        {% endfor %}
                    </select>
                </label>
                <label class="filter">
                    <span class="filter__label">Language</span>
                    <select class="filter__select" name="language" data-filter-select="language">
                        <option value="">Any language</option>
                        {% for language in filters.languages %}
                            <option value="{{ language }}" {% if selected_language == language %}selected{% endif %}>{{ language }}</option>
                        {% endfor %}
                    </select>
                </label>
                <label class="filter">
                    <span class="filter__label">Year</span>
                    <select class="filter__select" name="year" data-filter-select="year">
                        <option value="">Any year</option>
                        {% for year in filters.years %}
                            <option value="{{ year }}" {% if selected_year|stringformat:'s' == year|stringformat:'s' %}selected{% endif %}>{{ year }}</option>
                        {% endfor %}
                    </select>
                </label>
            </div>
        </div>
    </form>

    <!-- Saved groups rendered by JS, outside the form -->
    <div class="sp-groups" id="sp-groups"></div>
</section>
